[versions]
agp = "9.2.1"
libxposed-api = "102.0.0"
mcp-sdk = "0.12.0"
ktor = "3.6.0"
dexkit = "2.3.0"
fastkv = "3.0.1"

[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed-api" }
mcp-sdk-server = { group = "io.modelcontextprotocol", name = "kotlin-sdk-server", version.ref = "mcp-sdk" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktor" }
dexkit = { group = "org.luckypray", name = "dexkit", version.ref = "dexkit" }
fastkv = { group = "io.github.billywei01", name = "fastkv", version.ref = "fastkv" }
